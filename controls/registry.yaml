      Records model version, prompt-service configuration, human-gating posture, and the data-residency boundary (self-hosted models; no source code or regulated data leaves the trust boundary). Answers the auditor question "how is the AI assisting this SDLC itself controlled?".
    family: gxp-csa
    jurisdiction: global

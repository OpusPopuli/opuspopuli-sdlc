  - id: CTL-AIQ-001
    title: AI tool qualification — the AI assisting this SDLC is qualified for its intended use
    description: >-
      Answers the auditor question "how is the AI assisting this SDLC itself controlled?". The SDLC is assisted by Claude Code (Anthropic's Claude, e.g. Opus 4.x) — a hosted model, NOT self-hosted. Qualification rests on: a recorded model/plugin version, human approval gates at every lifecycle phase (no autonomous production changes), versioned skills whose actions are recorded, and an honest data-handling posture. Data handling: source code and diffs are sent to Anthropic's API; an organization qualifying this tool for regulated use should assess Anthropic's data-handling terms (no training on API inputs, zero-data-retention options) and decide accordingly — this control does NOT claim code stays in a local trust boundary. (The consuming application's runtime data residency is a separate concern — see CTL-HIPAA-002.)
    family: gxp-csa
    jurisdiction: global
    applicability: [ all ]
    citations:
      - adapter: clause
        framework: GAMP5-2E
        clause: AI/ML appendix
        edition_note: >-
          GAMP 5 2nd edition (ISPE, 2022) — verify exact appendix numbering against a licensed copy before citing in an audit response; text is never vendored here.
    implemented_by:
      - type: architecture
        ref: claude-code-tooling
        note: Anthropic Claude via Claude Code; hosted, versioned, recorded — not self-hosted
      - type: architecture
        ref: human-gated-skills
      - type: skill
        ref: op-validate
        note: qualification record (model/plugin version, gating, data-handling posture) in the release pack
    evidence:
      - docs/compliance/releases/*-validation.md
    status: active

  # US state privacy pack (#8). California is the inaugural region; the family is designed to be
  # extended — another state law (e.g. Virginia CDPA) is new CTL-<STATE>-* entries here, no schema
  # or adapter change. CA statutes/regulations are government works (public domain); sources are
  # checksummed via the document adapter, never vendored.
  - id: CTL-CCPA-001
    title: Personal and sensitive personal information — definitions and handling
    family: us-state-privacy
    jurisdiction: us-ca
    applicability: [ ca-personal-information ]
    citations:
      - adapter: document
        name: Cal. Civ. Code § 1798.140 (CCPA/CPRA definitions)
        url: https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.140
        normalization: text
        asserts:
          title: California Code, CIV 1798.140
          version: Amended by Stats. 2025, Ch. 67, Sec. 27. (AB 1170)
          issued: 2026-01-01
        note: Defines "personal information" (broader than classic PII) and "sensitive personal information"; anchors what op-data-scan looks for. The asserted version is the section's own enactment line, so a legislative amendment fails the assertion as well as moving the checksum (#43).
        pinned:
          sha256: 989c984ff5013028214e1c1e59bdf73d4cb7beb9191975c9082325021bbc37c6
          retrieved: 2026-07-31
      - adapter: document
        name: CPPA final CCPA regulations, Cal. Code Regs. tit. 11 div. 6 (text of 2023-03-29)
        url: https://cppa.ca.gov/regulations/pdf/20230329_final_regs_text.pdf
        normalization: raw
        cadence: quarterly # a dated final-text PDF; its bytes are fixed, a NEW adopted text is the real signal
        asserts:
          title: means the California Consumer Privacy Act of 2018
        note: "Regulations elaborating the statutory definitions and business handling duties. Dated final-text PDF — stable bytes; a newer adopted text is a drift signal (#4). ASSERTION LIMITATION (#43): extractPdfText recovers the body text but NOT the edition date — \"March 29\", \"Title 11\" and \"division 6\" are all absent from the extractable text, which is interleaved with accessibility-report metadata and octal-escaped punctuation. The 2023-03-29 edition therefore rests on the publisher's dated filename plus the sha256, not on anything the document says about itself; only the body-identity assertion above is corroborated. An assertion that looks verified but is not would be worse than none."
        pinned:
          sha256: 9bbda51893703afe9ef45249905e09ab1d278eaba2a6158af17e2c5f39696e72
          retrieved: 2026-07-31
    implemented_by:
      - type: skill
        ref: op-data-scan
    evidence:
      - docs/compliance/releases/*-validation.md
    status: active


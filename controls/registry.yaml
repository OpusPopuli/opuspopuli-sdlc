  - id: CTL-AIQ-001
    title: AI tool qualification — the AI assisting this SDLC is qualified for its intended use
    description: >-
      Answers the auditor question "how is the AI assisting this SDLC itself controlled?". The SDLC is assisted by a hosted coding agent (Claude Code or Codex) — NOT self-hosted. Qualification rests on: a recorded model/plugin version, human approval gates at every lifecycle phase (no autonomous production changes), versioned skills whose actions are recorded, and an honest data-handling posture. Data handling: source code and diffs are sent to the agent vendor's API (Anthropic or OpenAI); an organization qualifying the tool for regulated use should assess that vendor's data-handling terms (no training on API inputs, zero-data-retention options) and decide accordingly — this control does NOT claim code stays in a local trust boundary. (The consuming application's runtime data residency is a separate concern — see CTL-HIPAA-002.)
    family: sdlc-core
    jurisdiction: global
    applicability: [ all ]
    citations:
      - adapter: clause
        framework: GAMP5-2E
        clause: AI/ML appendix
        edition_note: >-
          GAMP 5 2nd edition (ISPE, 2022) — verify exact appendix numbering against a licensed copy before citing in an audit response; text is never vendored here.
    implemented_by:
      - type: architecture
        ref: hosted-coding-agent
        note: Claude Code (Anthropic) or Codex (OpenAI); hosted, versioned, recorded — not self-hosted
      - type: architecture
        ref: human-gated-skills
      - type: skill
        ref: op-validate
        note: qualification record (model/plugin version, gating, data-handling posture) in the release pack

# OpusPopuli SDLC — control registry (issue #1)
# Canonical source of the control mapping. Validated by controls/scripts/validate.ts against
# controls/schema/registry.schema.json; pins are produced by controls/scripts/pin.ts (network
# required — run from CI when the dev sandbox has restricted egress).
#
# status: pin-pending = a pinnable citation has no pin yet. The upstream drift watch (#4)
# re-verifies pins on a schedule; the internal drift gate (#3) reconciles this file against
# skills/, hooks/, and the generated docs.
version: 1

# Upstream drift-watch scheduling (#53). Cadence is declared per source, not applied uniformly:
# measured over ~10 years, 21 CFR §11.10/§11.50 and 45 CFR §164.312 changed ONCE each, while 21 CFR
# part 820 changed five times — three of them since 2024, mid-QMSR transition. Weekly polling of
# everything spent ~570 requests a year to catch 1-2 real events.
#
# HONESTY: lowering cadence is an EFFICIENCY choice, not a robustness one. A quarterly source can be
# stale for up to a quarter before the watch notices. Frequency was never the binding constraint on
# the failure this repo actually had — the CSA supersession (#41) survived five months of WEEKLY
# polling because the gap was structural (auto_poll:false, no assertions), not temporal.
drift:
  default_cadence: monthly

preamble:
  intended_use: controls/intended-use.md

profiles:
  # Framework families a consuming repo may declare. Controls outside a repo's declared
  # families are inert for that repo. Extension packs (#7-#9) add families here.
  families:
    - hipaa
    - part11
    - soc2
    - gxp-csa
    - iso-medical
    - us-state-privacy

# Display metadata for each family — the single source for the "Framework" column of the
# generated control-mapping table in docs/compliance-model.md (issue #2). validate.ts fails if a
# control uses a family with no entry here, so packs #7-#9 must add a label when they add a family.
#
# data_classes: the regulated-data categories a family brings into scope for op-data-scan. A
# consuming repo's compliance profile selects families; the union of their data_classes is what the
# scan looks for. Packs extend this: #8 adds ca-personal-information to us-state-privacy, #7 adds
# eu-personal-data to gdpr.
frameworks:
  hipaa: { label: HIPAA, sort: 1, data_classes: [ phi-pii ] }
  soc2: { label: SOC 2, sort: 2, data_classes: [] }
  part11: { label: 21 CFR Part 11, sort: 3, data_classes: [] }
  gxp-csa: { label: Part 11 / GxP (CSA), sort: 4, data_classes: [] }
  iso-medical: { label: ISO 62304 / 14971, sort: 5, data_classes: [] }
  us-state-privacy: { label: US state privacy (CCPA/CPRA), sort: 6, data_classes: [ ca-personal-information ] }


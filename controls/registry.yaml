        ref: op-issue-plan
        note: names any new third-party recipient of PHI and whether a BAA covers it
      - type: skill
        ref: op-review
        note: blocks a new PHI recipient with no confirmed BAA
      - type: architecture
        ref: business-associate-agreements
        note: executing and tracking BAAs is a contractual control
    evidence:

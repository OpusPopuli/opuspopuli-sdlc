        cfr_title: 45
        cfr_part: "164"
        cfr_section: "164.502"
        note: Uses and disclosures; minimum necessary
        pinned:
          amendment_date: 2024-06-25
          checked: 2026-07-30
    implemented_by:
      - type: architecture
        ref: self-hosted-models
      - type: architecture
        ref: private-prompt-service
      - type: skill
        ref: op-validate
        note: residency posture stated in every release validation pack
    evidence:
      - docs/compliance/releases/*-validation.md
    status: active

  - id: CTL-HIPAA-003
    title: Access to PHI is restricted and reviewed at the API surface
    family: hipaa
    jurisdiction: us
    applicability: [ us-phi ]
    citations:
      - adapter: ecfr
        cfr_title: 45
        cfr_part: "164"
        cfr_section: "164.312"
        note: Access control

  - id: CTL-HIPAA-002
    title: Runtime data residency and minimum necessary for regulated data
    description: >-
      A control the CONSUMING application satisfies in its own architecture: regulated data (e.g. PHI) processed at runtime stays within the app's trust boundary, and the minimum necessary is used. Opus Populi implements this with self-hosted inference and a private prompt-service so PHI is not sent to a third-party model vendor at runtime — but that is Opus Populi's implementation choice, not something the SDLC plugin provides. The SDLC's role is to review it (op-review) and record the posture in the release evidence (op-validate). Note: this is distinct from how the SDLC's own development-time AI (Claude Code) handles source code — see CTL-AIQ-001.
    family: hipaa
    jurisdiction: us
    applicability: [ us-phi ]
    citations:
      - adapter: ecfr
        cfr_title: 45
        cfr_part: "164"
        cfr_section: "164.502"
        cadence: monthly # velocity: 3 amendments, 2 of them in 2024 (2024-04-26, 2024-06-25)
        note: Uses and disclosures; minimum necessary
        pinned:
          amendment_date: 2024-06-25
          checked: 2026-07-30
    implemented_by:
      - type: architecture
        ref: consuming-app-runtime-residency
        note: the consuming app's runtime AI/data architecture (Opus Populi — self-hosted inference)
      - type: skill
        ref: op-review
        note: verifies changes don't send regulated data to a third-party runtime service
      - type: skill
        ref: op-validate
        note: records the consuming app's residency posture in the release validation pack
    evidence:
      - docs/compliance/releases/*-validation.md
    status: active

